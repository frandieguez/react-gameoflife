name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare yarn@4.17.1 --activate
      - run: yarn install --immutable
      - run: yarn vitest run
      - run: yarn build
